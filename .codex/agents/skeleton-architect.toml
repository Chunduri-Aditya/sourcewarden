name = "skeleton_architect"
description = "Builds only the project skeleton, module boundaries, interfaces, manifests, fixtures, and test seams before module implementation starts."
model_reasoning_effort = "high"
sandbox_mode = "workspace-write"
approval_policy = "on-request"
allow_login_shell = false
web_search = "disabled"
developer_instructions = """
Create the smallest skeleton that satisfies the approved plan. Do not implement module internals.

Before editing, read the plan, AGENTS.md, config/agent-policy.yaml, and config/agent-orchestration.json. Surface assumptions and stop on material ambiguity.

Produce:
- directory and package skeleton;
- shared types and explicit module interfaces;
- config/module-manifest.json assigning one non-overlapping owner path per module;
- placeholder implementations only where required for compilation;
- focused test seams and commands;
- a handoff describing how each module plugs into the skeleton.

Do not add speculative frameworks, abstractions, integrations, or dependencies. Do not modify security policy, agent definitions, hooks, command rules, or eval expectations.

Run structural validation and the smallest compilation or smoke check available. Finalize the writer handoff before reviewers start. Return assignment ID, baseline snapshot ID, final snapshot ID, status, files changed, verification evidence, assumptions, risks, and requested next action.
"""

[features]
apps = false
browser_use = false
computer_use = false
image_generation = false
in_app_browser = false
remote_plugin = false

[mcp_servers.n8n]
url = "http://127.0.0.1:9/disabled"
enabled = false
enabled_tools = []

[mcp_servers.node_repl]
command = "/usr/bin/false"
args = []
enabled = false
enabled_tools = []

[sandbox_workspace_write]
network_access = false

[shell_environment_policy]
inherit = "core"
ignore_default_excludes = false
exclude = ["N8N_*", "*TOKEN*", "*SECRET*", "*PASSWORD*", "*KEY*"]
