sandbox_mode = "read-only"
approval_policy = "on-request"
allow_login_shell = false
web_search = "disabled"

[sandbox_workspace_write]
network_access = false

[features]
hooks = true
apps = false
browser_use = false
computer_use = false
image_generation = false
in_app_browser = false
remote_plugin = false

[agents]
enabled = true
max_concurrent_threads_per_session = 3
interrupt_message = true
default_subagent_reasoning_effort = "medium"

[mcp_servers.node_repl]
command = "/usr/bin/false"
args = []
enabled = false
enabled_tools = []

[mcp_servers.n8n]
url = "http://localhost:5678/mcp-server/http"
bearer_token_env_var = "N8N_MCP_TOKEN"
required = true
tool_timeout_sec = 300
default_tools_approval_mode = "writes"
enabled_tools = [
  "get_sdk_reference",
  "get_workflow_best_practices",
  "search_nodes",
  "get_node_types",
  "list_credentials",
  "explore_node_resources",
  "list_workflows",
  "get_workflow",
  "validate_node_config",
  "validate_workflow",
  "prepare_test_pin_data",
  "create_workflow_from_code",
  "update_workflow",
  "test_workflow",
  "publish_workflow",
  "unpublish_workflow",
  "execute_workflow",
  "archive_workflow",
]

[mcp_servers.n8n.tools.publish_workflow]
approval_mode = "prompt"

[mcp_servers.n8n.tools.unpublish_workflow]
approval_mode = "prompt"

[mcp_servers.n8n.tools.execute_workflow]
approval_mode = "prompt"

[mcp_servers.n8n.tools.archive_workflow]
approval_mode = "prompt"

[mcp_servers.n8n.tools.update_workflow]
approval_mode = "prompt"

[mcp_servers.n8n.tools.create_workflow_from_code]
approval_mode = "prompt"

[mcp_servers.n8n.tools.test_workflow]
approval_mode = "prompt"

[shell_environment_policy]
inherit = "core"
ignore_default_excludes = false
exclude = ["N8N_*", "*TOKEN*", "*SECRET*", "*PASSWORD*", "*KEY*"]
